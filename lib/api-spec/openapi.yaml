openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Arcform AI training API
servers:
  - url: /api
tags:
  - name: health
  - name: auth
  - name: training
  - name: trainer
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /auth/profile:
    get:
      operationId: getAuthProfile
      tags: [auth]
      responses:
        "200":
          description: Current Arcform profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthProfile"}
    post:
      operationId: saveAuthProfile
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthProfileInput"}
      responses:
        "200":
          description: Saved Arcform profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthProfile"}
  /training/profile:
    get:
      operationId: getTrainingProfile
      tags: [training]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingProfile"}
    post:
      operationId: saveTrainingProfile
      tags: [training]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainingProfileInput"}
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingProfile"}
  /training/plan:
    get:
      operationId: getTrainingPlan
      tags: [training]
      responses:
        "200":
          description: Current plan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingPlan"}
    post:
      operationId: generateTrainingPlan
      tags: [training]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeneratePlanInput"}
      responses:
        "200":
          description: Generated plan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingPlan"}
  /training/dashboard:
    get:
      operationId: getTrainingDashboard
      tags: [training]
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dashboard"}
  /training/chat:
    post:
      operationId: chatWithCoach
      tags: [training]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CoachChatInput"}
      responses:
        "200":
          description: Coach response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CoachReply"}
  /training/workouts/{workoutId}/log:
    post:
      operationId: logWorkout
      tags: [training]
      parameters:
        - in: path
          name: workoutId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkoutLogInput"}
      responses:
        "200":
          description: Logged workout and adaptation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkoutLogResult"}
  /training/invite-code:
    get:
      operationId: getAthleteInviteCode
      tags: [training]
      responses:
        "200":
          description: Current athlete invite status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AthleteInviteCode"}
    post:
      operationId: generateAthleteInviteCode
      tags: [training]
      responses:
        "200":
          description: Generated athlete invite code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AthleteInviteCode"}
  /training/nutrition/{date}:
    get:
      operationId: getDailyNutrition
      tags: [training]
      parameters:
        - in: path
          name: date
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: Daily nutrition summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DailyNutrition"}
    post:
      operationId: addNutritionMeal
      tags: [training]
      parameters:
        - in: path
          name: date
          required: true
          schema: {type: string, format: date}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NutritionMealInput"}
      responses:
        "201":
          description: Updated daily nutrition summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DailyNutrition"}
  /training/nutrition/{date}/meals/{mealId}:
    delete:
      operationId: deleteNutritionMeal
      tags: [training]
      parameters:
        - in: path
          name: date
          required: true
          schema: {type: string, format: date}
        - in: path
          name: mealId
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Updated daily nutrition summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DailyNutrition"}
  /trainer/clients:
    get:
      operationId: listTrainerClients
      tags: [trainer]
      responses:
        "200":
          description: Trainer client roster
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TrainerClient"}
  /trainer/client-links:
    post:
      operationId: linkTrainerClient
      tags: [trainer]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainerClientLinkInput"}
      responses:
        "201":
          description: Athlete linked to trainer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainerClient"}
  /trainer/clients/{clientId}:
    get:
      operationId: getTrainerClient
      tags: [trainer]
      parameters:
        - in: path
          name: clientId
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Trainer client
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainerClient"}
    patch:
      operationId: updateTrainerClient
      tags: [trainer]
      parameters:
        - in: path
          name: clientId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainerClientSettings"}
      responses:
        "200":
          description: Client settings and programming updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainerClient"}
  /trainer/clients/{clientId}/updates:
    post:
      operationId: addTrainerClientUpdate
      tags: [trainer]
      parameters:
        - in: path
          name: clientId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainerClientUpdateInput"}
      responses:
        "201":
          description: Client update added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainerClient"}
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string}
    AuthProfileInput:
      type: object
      required: [name, email, role]
      properties:
        name: {type: string, minLength: 1}
        email: {type: string, format: email}
        role: {type: string, enum: [athlete, trainer]}
    AuthProfile:
      type: object
      required: [clerkUserId, name, email, role]
      properties:
        clerkUserId: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [athlete, trainer]}
    TrainingProfile:
      allOf:
        - $ref: "#/components/schemas/TrainingProfileInput"
        - type: object
          required: [complete]
          properties:
            complete: {type: boolean}
    TrainingProfileInput:
      type: object
      required: [goal, lifestyle, experience, daysPerWeek, equipment]
      properties:
        goal: {type: string, enum: [strength, hypertrophy, general, fat_loss]}
        lifestyle: {type: string, enum: [sedentary, active, very_active]}
        experience: {type: string, enum: [beginner, intermediate, advanced]}
        daysPerWeek: {type: integer, minimum: 2, maximum: 6}
        equipment: {type: string, enum: [full_gym, home_gym, bodyweight]}
        age: {type: integer, minimum: 13, maximum: 100}
        weight: {type: number, exclusiveMinimum: 0}
        weightUnit: {type: string, enum: [lb, kg]}
        height: {type: number, exclusiveMinimum: 0}
        heightUnit: {type: string, enum: [in, cm]}
        sex: {type: string, enum: [male, female]}
        bmrMifflin: {type: integer, minimum: 1}
        bmrHarris: {type: integer, minimum: 1}
    GeneratePlanInput:
      type: object
      required: [profile]
      properties:
        profile: {$ref: "#/components/schemas/TrainingProfileInput"}
    Exercise:
      type: object
      required: [id, name, sets, reps, targetWeight, targetRpe]
      properties:
        id: {type: string, minLength: 1, description: Unique across the workout plan}
        name: {type: string, minLength: 1}
        sets: {type: integer, minimum: 1}
        reps: {type: string, minLength: 1}
        targetWeight: {type: string, minLength: 1}
        targetRpe: {type: number, minimum: 1, maximum: 10}
    Workout:
      type: object
      required: [id, day, title, focus, duration, status, exercises]
      properties:
        id: {type: string, minLength: 1, description: Unique across the workout plan}
        day: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        focus: {type: string, minLength: 1}
        duration: {type: integer, minimum: 1}
        status: {type: string, enum: [upcoming, completed]}
        exercises:
          type: array
          items: {$ref: "#/components/schemas/Exercise"}
    TrainingPlan:
      type: object
      required: [name, week, totalWeeks, rationale, workouts]
      properties:
        name: {type: string}
        week: {type: integer}
        totalWeeks: {type: integer}
        rationale: {type: string}
        workouts:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Workout"}
    Dashboard:
      type: object
      required: [streak, completedThisWeek, scheduledThisWeek, volumeChange, calorieGoal, weeklyVolumeGoal, nextWorkout, history]
      properties:
        streak: {type: integer}
        completedThisWeek: {type: integer}
        scheduledThisWeek: {type: integer}
        volumeChange: {type: number}
        calorieGoal: {type: integer}
        weeklyVolumeGoal: {type: integer}
        nextWorkout: {$ref: "#/components/schemas/Workout"}
        history:
          type: array
          items: {$ref: "#/components/schemas/HistoryItem"}
    HistoryItem:
      type: object
      required: [id, title, date, duration, totalSets, avgRpe]
      properties:
        id: {type: string}
        title: {type: string}
        date: {type: string}
        duration: {type: integer}
        totalSets: {type: integer}
        avgRpe: {type: number}
    CoachChatInput:
      type: object
      required: [message]
      properties:
        message: {type: string, minLength: 1}
    CoachReply:
      type: object
      required: [message, adjusted]
      properties:
        message: {type: string}
        adjusted: {type: boolean}
    LoggedSet:
      type: object
      required: [exerciseId, setNumber, reps, weight, rpe]
      properties:
        exerciseId: {type: string}
        setNumber: {type: integer}
        reps: {type: integer}
        weight: {type: number}
        rpe: {type: number, minimum: 1, maximum: 10}
    WorkoutLogInput:
      type: object
      required: [sets]
      properties:
        sets:
          type: array
          items: {$ref: "#/components/schemas/LoggedSet"}
        notes: {type: string}
    WorkoutLogResult:
      type: object
      required: [success, adaptation]
      properties:
        success: {type: boolean}
        adaptation: {type: string}
    AthleteInviteCode:
      type: object
      required: [code, linked]
      properties:
        code:
          type: ["string", "null"]
          pattern: "^[0-9]{6}$"
        linked: {type: boolean}
        trainerName: {type: ["string", "null"]}
    NutritionMealInput:
      type: object
      required: [name, calories, protein, carbs, fat]
      properties:
        name: {type: string, minLength: 1}
        calories: {type: integer, minimum: 0}
        protein: {type: number, minimum: 0}
        carbs: {type: number, minimum: 0}
        fat: {type: number, minimum: 0}
    NutritionMeal:
      allOf:
        - $ref: "#/components/schemas/NutritionMealInput"
        - type: object
          required: [id]
          properties:
            id: {type: string}
    DailyNutrition:
      type: object
      required: [date, calorieGoal, caloriesConsumed, proteinGoal, proteinConsumed, carbsGoal, carbsConsumed, fatGoal, fatConsumed, meals]
      properties:
        date: {type: string, format: date}
        calorieGoal: {type: integer, minimum: 0}
        caloriesConsumed: {type: integer, minimum: 0}
        proteinGoal: {type: number, minimum: 0}
        proteinConsumed: {type: number, minimum: 0}
        carbsGoal: {type: number, minimum: 0}
        carbsConsumed: {type: number, minimum: 0}
        fatGoal: {type: number, minimum: 0}
        fatConsumed: {type: number, minimum: 0}
        meals:
          type: array
          items: {$ref: "#/components/schemas/NutritionMeal"}
    TrainerClientLinkInput:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: "^[0-9]{6}$"}
    TrainerClientSettings:
      type: object
      properties:
        calorieGoal: {type: integer, minimum: 1000, maximum: 6000}
        weeklyVolumeGoal: {type: integer, minimum: 1, maximum: 200}
        workoutSplit: {type: string, minLength: 1}
        workouts:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Workout"}
    TrainerClientUpdateInput:
      type: object
      required: [message, type]
      properties:
        message: {type: string, minLength: 1}
        type: {type: string, enum: [coach, progress, nutrition, programming]}
    TrainerClientUpdate:
      type: object
      required: [id, date, message, type]
      properties:
        id: {type: string}
        date: {type: string}
        message: {type: string}
        type: {type: string, enum: [coach, progress, nutrition, programming]}
    TrainerClient:
      type: object
      required: [id, name, email, goal, status, lastCheckIn, progressScore, adherence, streak, calorieGoal, weeklyVolumeGoal, workoutSplit, workouts, updates]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        goal: {type: string}
        status: {type: string, enum: [on_track, attention, new]}
        lastCheckIn: {type: string}
        progressScore: {type: integer, minimum: 0, maximum: 100}
        adherence: {type: integer, minimum: 0, maximum: 100}
        streak: {type: integer, minimum: 0}
        calorieGoal: {type: integer}
        weeklyVolumeGoal: {type: integer}
        workoutSplit: {type: string}
        workouts:
          type: array
          items: {$ref: "#/components/schemas/Workout"}
        updates:
          type: array
          items: {$ref: "#/components/schemas/TrainerClientUpdate"}