kind = "mobile"
previewPath = "/arcform-mobile/"
title = "Arcform Mobile"
description = "A native iOS companion for Arcform athletes with Clerk authentication, AI Coach chat, and mobile-first training access."
version = "1.0.0"
id = "artifacts/arcform-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/arcform-mobile/" ]
localPort = 18117

[services.development]
run = "pnpm --filter @workspace/arcform-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arcform-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/arcform-mobile", "run", "serve" ]

[services.env]
PORT = "18117"
BASE_PATH = "/arcform-mobile/"
